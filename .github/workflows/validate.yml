name: validate
on: [push, pull_request]
jobs:
  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz | tar xz
          sudo mv prometheus-2.54.1.linux-amd64/promtool /usr/local/bin/
      - run: scripts/check-config.sh
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: make tf-validate
