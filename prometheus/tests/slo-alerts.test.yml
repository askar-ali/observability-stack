rule_files:
  - ../rules/slo-alerts.yml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api", code="200"}'
        values: '0+90x120'
      - series: 'http_requests_total{job="api", code="500"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels: { severity: critical, job: api }
            exp_annotations: { summary: "api is burning its error budget 14x too fast" }
