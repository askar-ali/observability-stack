# Requires kube-state-metrics and kubelet/cAdvisor metrics.
groups:
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is restarting repeatedly"
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
      - alert: PersistentVolumeFillingUp
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} under 15% free"
